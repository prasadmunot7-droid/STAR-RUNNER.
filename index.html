
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Runner</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: Arial, sans-serif;
  background: #07132e;
  color: white;
  overflow: hidden;
  touch-action: none;
}

canvas {
  display: block;
  width: 100vw;
  height: 100dvh;
  background: #07132e;
}

#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  font-size: 20px;
  font-weight: bold;
  pointer-events: none;
  z-index: 2;
}

.pill {
  background: #102c58dd;
  padding: 10px 16px;
  border: 2px solid #48dfff;
  border-radius: 30px;
}

#screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #06112bcc;
  z-index: 5;
}

.panel {
  width: 88%;
  max-width: 360px;
  padding: 28px 22px;
  text-align: center;
  border: 3px solid #46dcff;
  border-radius: 25px;
  background: linear-gradient(145deg,#122d69,#27105c);
  box-shadow: 0 0 30px #00bfff66;
}

h1 {
  font-size: 38px;
  color: #ffe34d;
  text-shadow: 3px 4px #f05b22;
  margin-bottom: 12px;
}

p {
  font-size: 17px;
  line-height: 1.5;
  margin: 12px 0 22px;
  color: #e2f6ff;
}

button {
  border: none;
  border-radius: 18px;
  padding: 15px 28px;
  font-size: 21px;
  font-weight: bold;
  color: white;
  background: linear-gradient(#54ed60,#10a83d);
  box-shadow: 0 5px #08732a;
  cursor: pointer;
}

button:active {
  transform: translateY(4px);
  box-shadow: 0 1px #08732a;
}

#controls {
  position: fixed;
  bottom: 25px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 25px;
  z-index: 3;
  pointer-events: none;
}

.control {
  pointer-events: auto;
  width: 75px;
  height: 75px;
  border-radius: 50%;
  padding: 0;
  font-size: 32px;
  background: linear-gradient(#24bfff,#1452db);
  border: 3px solid white;
  box-shadow: 0 5px #102c78;
  touch-action: none;
}

#hint {
  position: fixed;
  bottom: 115px;
  width: 100%;
  text-align: center;
  color: #b9eaff;
  font-size: 14px;
  pointer-events: none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="pill">⭐ <span id="score">0</span></div>
  <div class="pill">🏆 <span id="best">0</span></div>
</div>

<div id="hint">Collect stars • Avoid rocks!</div>

<div id="controls">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
</div>

<div id="screen">
  <div class="panel">
    <h1 id="title">⭐ STAR<br>RUNNER</h1>
    <p id="message">
      Collect shining stars!<br>
      Avoid falling rocks.<br>
      How high can you score?
    </p>
    <button id="start">▶ PLAY NOW</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const screen = document.getElementById("screen");
const title = document.getElementById("title");
const message = document.getElementById("message");
const startBtn = document.getElementById("start");

let W, H;
let running = false;
let score = 0;
let best = 0;
let speed = 3;
let frame = 0;
let objects = [];
let stars = [];
let keys = {left:false,right:false};

try {
  best = Number(localStorage.getItem("starBest")) || 0;
} catch(e) {}

bestEl.textContent = best;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const player = {
  x: 0,
  y: 0,
  w: 38,
  h: 48,
  speed: 6
};

function reset() {
  score = 0;
  speed = 3;
  frame = 0;
  objects = [];

  player.x = W / 2;
  player.y = H - 150;

  scoreEl.textContent = score;
}

function startGame() {
  reset();
  running = true;
  screen.style.display = "none";
  requestAnimationFrame(loop);
}

startBtn.addEventListener("click", startGame);

function endGame() {
  running = false;

  if (score > best) {
    best = score;
    bestEl.textContent = best;

    try {
      localStorage.setItem("starBest", best);
    } catch(e) {}
  }

  title.innerHTML = "GAME<br>OVER";
  message.innerHTML =
    "⭐ Your Score: " + score +
    "<br>🏆 Best Score: " + best +
    "<br><br>Ready for another adventure?";

  startBtn.textContent = "🔄 PLAY AGAIN";
  screen.style.display = "flex";
}

function starShape(x,y,r) {
  ctx.beginPath();

  for (let i=0;i<10;i++) {
    let angle = -Math.PI/2 + i*Math.PI/5;
    let radius = i%2===0 ? r : r*0.45;

    let px = x + Math.cos(angle)*radius;
    let py = y + Math.sin(angle)*radius;

    if(i===0) ctx.moveTo(px,py);
    else ctx.lineTo(px,py);
  }

  ctx.closePath();
  ctx.fill();
}

function drawBackground() {
  let g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#07132e");
  g.addColorStop(0.6,"#173c78");
  g.addColorStop(1,"#07132e");

  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // Distant stars
  ctx.fillStyle = "#ffffff";

  for(let i=0;i<45;i++) {
    let x = (i*137)%W;
    let y = (i*97 + frame*0.4)%(H);
    ctx.globalAlpha = 0.3 + (i%5)*0.12;
    ctx.fillRect(x,y,2,2);
  }

  ctx.globalAlpha = 1;

  // Jungle mountains
  ctx.fillStyle = "#102d55";
  ctx.beginPath();
  ctx.moveTo(0,H*0.58);

  for(let x=0;x<=W+100;x+=100) {
    ctx.lineTo(x,H*0.45+Math.sin(x*0.02)*45);
  }

  ctx.lineTo(W,H);
  ctx.lineTo(0,H);
  ctx.fill();

  // Ground
  ctx.fillStyle = "#14583f";
  ctx.fillRect(0,H-55,W,55);

  ctx.fillStyle = "#35db7c";
  ctx.fillRect(0,H-55,W,6);

  // Ground stripes
  ctx.fillStyle = "#24724b";

  for(let i=0;i<W;i+=40) {
    ctx.fillRect(i+(frame%40),H-35,20,5);
  }
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x,player.y);

  // Shadow
  ctx.fillStyle = "#0008";
  ctx.beginPath();
  ctx.ellipse(0,player.h/2+8,22,7,0,0,Math.PI*2);
  ctx.fill();

  // Legs
  ctx.fillStyle = "#163de2";
  ctx.fillRect(-13,8,10,19);
  ctx.fillRect(4,8,10,19);

  // Shoes
  ctx.fillStyle = "#ff5a36";
  ctx.fillRect(-17,23,15,7);
  ctx.fillRect(3,23,15,7);

  // Body
  ctx.fillStyle = "#ff5c2f";
  ctx.beginPath();
  ctx.roundRect(-18,-17,36,33,9);
  ctx.fill();

  // Backpack
  ctx.fillStyle = "#0877b9";
  ctx.fillRect(-22,-12,9,24);

  // Face
  ctx.fillStyle = "#ffca8b";
  ctx.beginPath();
  ctx.arc(0,-25,16,0,Math.PI*2);
  ctx.fill();

  // Hair
  ctx.fillStyle = "#40200f";
  ctx.beginPath();
  ctx.arc(0,-31,16,Math.PI,Math.PI*2);
  ctx.lineTo(16,-25);
  ctx.lineTo(7,-31);
  ctx.lineTo(-2,-24);
  ctx.lineTo(-15,-25);
  ctx.fill();

  // Eyes
  ctx.fillStyle = "#222";
  ctx.beginPath();
  ctx.arc(-5,-25,2,0,Math.PI*2);
  ctx.arc(5,-25,2,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function spawnObject() {
  let isStar = Math.random() > 0.35;

  objects.push({
    x: 25 + Math.random()*(W-50),
    y: -30,
    r: isStar ? 15 : 19,
    type: isStar ? "star" : "rock",
    speed: speed + Math.random()*2
  });
}

function drawObject(o) {
  if(o.type === "star") {
    ctx.fillStyle = "#ffe438";
    ctx.shadowColor = "#ffdf00";
    ctx.shadowBlur = 15;
    starShape(o.x,o.y,o.r);
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = "#858fa7";
    ctx.strokeStyle = "#c4d2e9";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#59657d";
    ctx.beginPath();
    ctx.arc(o.x-5,o.y-4,4,0,Math.PI*2);
    ctx.fill();
  }
}

function collision(a,b) {
  return Math.abs(a.x-b.x) < a.w/2+b.r*0.7 &&
         Math.abs(a.y-b.y) < a.h/2+b.r*0.7;
}

function update() {
  frame++;

  if(keys.left) player.x -= player.speed;
  if(keys.right) player.x += player.speed;

  // Keep player inside screen
  player.x = Math.max(25,Math.min(W-25,player.x));

  // Difficulty increases gradually
  speed = 3 + Math.min(score*0.04,5);

  if(frame%45===0) spawnObject();

  for(let i=objects.length-1;i>=0;i--) {
    let o = objects[i];

    o.y += o.speed;

    if(collision(player,o)) {
      if(o.type==="star") {
        score++;
        scoreEl.textContent = score;
        objects.splice(i,1);
        continue;
      } else {
        endGame();
        return;
      }
    }

    if(o.y>H+30) {
      objects.splice(i,1);
    }
  }
}

function draw() {
  drawBackground();

  for(let o of objects) drawObject(o);

  drawPlayer();
}

function loop() {
  if(!running) return;

  update();

  if(!running) return;

  draw();
  requestAnimationFrame(loop);
}

// Touch buttons
function bindButton(id,direction) {
  const btn = document.getElementById(id);

  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[direction]=true;
    btn.setPointerCapture(e.pointerId);
  });

  btn.addEventListener("pointerup",()=>{
    keys[direction]=false;
  });

  btn.addEventListener("pointercancel",()=>{
    keys[direction]=false;
  });

  btn.addEventListener("lostpointercapture",()=>{
    keys[direction]=false;
  });
}

bindButton("left","left");
bindButton("right","right");

// Keyboard support
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft" || e.key==="a")
    keys.left=true;

  if(e.key==="ArrowRight" || e.key==="d")
    keys.right=true;
});

document.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft" || e.key==="a")
    keys.left=false;

  if(e.key==="ArrowRight" || e.key==="d")
    keys.right=false;
});

// Initial screen
drawBackground();
drawPlayer();
</script>

</body>
</html>
